<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AniMind - Tu IA Personal de Anime</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <div class="chat-container">
        <!-- Cabecera -->
        <header class="chat-header">
            <div class="header-left">
                <div class="header-title">
                    <h1>AniMind</h1>
                    <p>Tu IA personal de anime</p>
                </div>
            </div>
            
            <div class="header-actions">
                <!-- Selector de Personalidad -->
                <select id="personality-select" class="personality-dropdown" title="Cambiar personalidad">
                    <option value="otaku">🌸 Entusiasta (Otaku)</option>
                    <option value="critico">🎭 Crítico Analítico</option>
                    <option value="sensei">📜 Maestro Sensei</option>
                </select>

                <!-- Botón Exportar Chat -->
                <button id="export-btn" class="icon-btn" title="Exportar conversación">📥</button>

                <!-- Botón Reiniciar Chat -->
                <button id="reset-btn" class="icon-btn" title="Reiniciar chat">🔄</button>
            </div>
        </header>

        <!-- Área de Mensajes -->
        <div class="chat-box" id="chat-box">
            <div class="message bot">
                <span class="sender-name">AniMind</span>
                <div class="message-content">¡Hola! 🌸 Cuéntame qué te apetece ver hoy o selecciona tus géneros preferidos. Te recomendaré el anime perfecto para ti.</div>
            </div>
        </div>

        <!-- Sugerencias Rápidas -->
        <div class="quick-suggestions">
            <button onclick="enviarSugerencia('Recomiéndame un anime de acción corto')">🔥 Acción</button>
            <button onclick="enviarSugerencia('Recomiéndame una película anime emocionante')">🎬 Película</button>
            <button onclick="enviarSugerencia('Dame una joya oculta de comedia')">💎 Comedia</button>
        </div>

        <!-- Formulario de Entrada -->
        <form class="chat-input-container" id="chat-form">
            <input type="text" id="user-input" placeholder="Escribe lo que te apetece..." required autocomplete="off">
            <button type="submit" id="send-btn">Enviar</button>
        </form>
    </div>

    <script>
        const chatForm = document.getElementById('chat-form');
        const userInput = document.getElementById('user-input');
        const chatBox = document.getElementById('chat-box');
        const sendBtn = document.getElementById('send-btn');
        const resetBtn = document.getElementById('reset-btn');
        const exportBtn = document.getElementById('export-btn');
        const personalitySelect = document.getElementById('personality-select');

        let historialConversacion = [];

        // Función para enviar sugerencias rápidas
        function enviarSugerencia(texto) {
            userInput.value = texto;
            chatForm.dispatchEvent(new Event('submit'));
        }

        // Envío de mensaje
        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const message = userInput.value.trim();
            if (!message) return;

            // Bloquear botón para evitar spam
            sendBtn.disabled = true;

            // Añadir mensaje usuario
            const userDiv = document.createElement('div');
            userDiv.className = 'message user';
            userDiv.innerText = message;
            chatBox.appendChild(userDiv);
            historialConversacion.push(`Usuario: ${message}`);

            userInput.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;

            // Mensaje bot cargando
            const botDiv = document.createElement('div');
            botDiv.className = 'message bot';
            botDiv.innerHTML = '<span class="sender-name">AniMind</span><div class="message-content">Pensando... 🌸</div>';
            chatBox.appendChild(botDiv);
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        message: message,
                        personality: personalitySelect.value 
                    })
                });
                const data = await response.json();

                // Limpieza de símbolos y sangría limpia
                let textLimpio = data.response.replace(/[*#]/g, '');
                botDiv.querySelector('.message-content').innerText = textLimpio;
                historialConversacion.push(`AniMind: ${textLimpio}`);

            } catch (error) {
                botDiv.querySelector('.message-content').innerText = '❌ Error de conexión al servidor.';
            } finally {
                sendBtn.disabled = false;
                chatBox.scrollTop = chatBox.scrollHeight;
            }
        });

        // Botón Reiniciar
        resetBtn.addEventListener('click', () => {
            chatBox.innerHTML = `
                <div class="message bot">
                    <span class="sender-name">AniMind</span>
                    <div class="message-content">¡Chat reiniciado! 🌸 ¿Qué anime buscamos ahora?</div>
                </div>
            `;
            historialConversacion = [];
        });

        // Botón Exportar a Archivo .txt
        exportBtn.addEventListener('click', () => {
            if (historialConversacion.length === 0) {
                alert("No hay mensajes en la conversación para exportar.");
                return;
            }

            const contenido = "--- RECOMENDACIONES DE ANIMIND ---\n\n" + historialConversacion.join("\n\n-----------------------------------\n\n");
            const blob = new Blob([contenido], { type: 'text/plain;charset=utf-8' });
            const enlace = document.createElement('a');
            enlace.href = URL.createObjectURL(blob);
            enlace.download = 'Recomendaciones_AniMind.txt';
            enlace.click();
            URL.revokeObjectURL(enlace.href);
        });
    </script>
</body>
</html>
