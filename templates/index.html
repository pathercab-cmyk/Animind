<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AniMind - Tu IA Personal de Anime</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <div class="chat-container">
        <!-- Cabecera -->
        <header class="chat-header">
            <div class="header-left">
                <!-- Puedes desmarcar la siguiente línea si subes la imagen a static/logo.png -->
                <!-- <img src="{{ url_for('static', filename='logo.png') }}" alt="AniMind Logo" class="app-logo"> -->
                
                <div class="header-title">
                    <h1>AniMind</h1>
                    <p>Tu IA personal de anime</p>
                </div>
            </div>
            
            <div class="status-badge">
                <span class="status-dot"></span> En línea
            </div>
        </header>

        <!-- Área de Chat / Mensajes -->
        <div class="chat-box" id="chat-box">
            <div class="message bot">
                <span class="sender-name">AniMind</span>
                ¡Hola! 🌸 Cuéntame qué te apetece ver hoy o selecciona tus géneros preferidos. Te recomendaré el anime perfecto para ti.
            </div>
        </div>

        <!-- Barra de Entrada de Texto -->
        <form class="chat-input-container" id="chat-form">
            <input type="text" id="user-input" placeholder="Escribe lo que te apetece... (Ej. 'algo con mucha acción')" required autocomplete="off">
            <button type="submit">Enviar</button>
        </form>
    </div>

    <script>
        const chatForm = document.getElementById('chat-form');
        const userInput = document.getElementById('user-input');
        const chatBox = document.getElementById('chat-box');

        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const message = userInput.value.trim();
            if (!message) return;

            // Añadir mensaje del usuario al chat
            const userDiv = document.createElement('div');
            userDiv.className = 'message user';
            userDiv.innerText = message;
            chatBox.appendChild(userDiv);

            userInput.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;

            // Añadir mensaje provisional de carga
            const botDiv = document.createElement('div');
            botDiv.className = 'message bot';
            botDiv.innerHTML = '<span class="sender-name">AniMind</span>Pensando... 🌸';
            chatBox.appendChild(botDiv);
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: message })
                });
                const data = await response.json();
                botDiv.innerHTML = '<span class="sender-name">AniMind</span>' + data.response;
            } catch (error) {
                botDiv.innerHTML = '<span class="sender-name">AniMind</span>❌ Error de conexión al servidor.';
            }
            chatBox.scrollTop = chatBox.scrollHeight;
        });
    </script>
</body>
</html>
